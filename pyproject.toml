[project]
name = "heloc_tracker"
version = "0.2.0"
description = "Borrower-side amortization tracking for hybrid HELOC / Prêt Lié liabilities in ERPNext"
authors = [
    { name = "Jonathan", email = "you@example.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
readme = "README.md"

# No PyPI packages here - "frappe" is provided by the bench itself, not by
# PyPI, so it must never be listed as a dependency (pip/uv will otherwise
# try to fetch an unrelated same-named package from PyPI and fail).
dependencies = []

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["heloc_tracker*"]

# Declares which Frappe version(s) this app is compatible with, per the
# current bench convention - not a pip dependency, just a compatibility
# check bench runs during install.
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
